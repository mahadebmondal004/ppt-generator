server {
    listen 80;
    server_name your_domain_or_ec2_public_ip;

    # Frontend static production build files
    location / {
        root /var/www/ppt-generator/frontend/dist;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # API Backend Proxy
    location /api {
        proxy_pass http://127.0.0.1:5001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded-for;
    }

    # Static uploads (generated slide images) proxy
    location /uploads {
        proxy_pass http://127.0.0.1:5001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded-for;
    }

    # Increase max upload size for scanned pages / reference files
    client_max_body_size 50M;
}
